name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  attacks-and-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
